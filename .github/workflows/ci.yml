name: CI

# Runs on pull requests, and is the gate docker-publish.yml calls before it publishes
# anything, so the checks guarding a PR and the checks guarding a deploy can't drift apart.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile.
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # The built page and the game, served by the real production server.
      - name: Smoke test the production server
        run: |
          PORT=6099 node server/server.mjs &
          for _ in $(seq 1 20); do curl -sf http://127.0.0.1:6099/healthz && break; sleep 0.5; done
          base=http://127.0.0.1:6099
          curl -sf $base/ | grep -q '<title>Vollmond</title>'
          curl -sf $base/KXPT | grep -q '<title>Vollmond</title>'
          curl -sf $base/KXPT/screen | grep -q '<title>Vollmond</title>'
          curl -sI $base/ | grep -qi "content-security-policy: default-src 'self'"
          curl -sI $base/ | grep -qi "cache-control: no-cache"
          curl -sf $base/manifest.webmanifest | grep -q '"name": "Vollmond"'
          curl -sf -o /dev/null $base/sw.js
          curl -sf -o /dev/null $base/og.png
          # Every role's card (the catalogue in /api/config) and the back.
          for card in $(curl -sf $base/api/config | node -pe 'JSON.parse(require("fs").readFileSync(0)).roles.map((r) => r.id).join(" ")') back; do curl -sf -o /dev/null $base/cards/$card.svg || { echo "no card: $card"; exit 1; }; done
          test "$(curl -sf $base/api/config | node -pe 'JSON.parse(require("fs").readFileSync(0)).roles.length')" = 32
          asset=$(curl -s $base/ | grep -o '/assets/[^"]*\.js' | head -1)
          curl -sI "$base$asset" | grep -qi 'cache-control: public, max-age=31536000, immutable'
          test "$(curl -s -o /dev/null -w '%{http_code}' $base/assets/missing.js)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST $base/)" = 405
          test "$(curl -s -o /dev/null -w '%{http_code}' $base/api/nothing)" = 404
          curl -sf $base/api/config | grep -q '"minPlayers":5'
          # A village, a second player, five bots, a game dealt, and each stream carrying only its own card.
          room=$(curl -sf -X POST -H 'content-type: application/json' --data '{"name":"CI"}' $base/api/rooms)
          code=$(echo "$room" | node -pe 'JSON.parse(require("fs").readFileSync(0)).code')
          token=$(echo "$room" | node -pe 'JSON.parse(require("fs").readFileSync(0)).token')
          me=$(echo "$room" | node -pe 'JSON.parse(require("fs").readFileSync(0)).player')
          curl -sf -X POST -H 'content-type: application/json' --data '{"name":"Zwei"}' $base/api/rooms/$code/join | grep -q '"player"'
          for _ in 1 2 3 4 5; do curl -sf -X POST -H 'content-type: application/json' -H "x-vollmond-token: $token" --data '{}' $base/api/rooms/$code/bot; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -H "x-vollmond-token: $token" --data '{}' $base/api/rooms/$code/start)" = 204
          curl -s -N --max-time 2 "$base/api/rooms/$code/events?p=$me" | grep -q '"phase":"deal"'
          curl -s -N --max-time 2 "$base/api/rooms/$code/events?p=$me" | grep -q '"me":{"id":"'$me'","role":"'
          # The big screen's stream (no p) knows no card.
          if curl -s -N --max-time 2 "$base/api/rooms/$code/events" | grep -q '"role":"[a-z]'; then echo "the big screen saw a card"; exit 1; fi
          # One night: three players, its own engine, and still no card on the big screen.
          room=$(curl -sf -X POST -H 'content-type: application/json' --data '{"name":"CI"}' $base/api/rooms)
          code=$(echo "$room" | node -pe 'JSON.parse(require("fs").readFileSync(0)).code')
          token=$(echo "$room" | node -pe 'JSON.parse(require("fs").readFileSync(0)).token')
          me=$(echo "$room" | node -pe 'JSON.parse(require("fs").readFileSync(0)).player')
          curl -sf -X POST -H 'content-type: application/json' -H "x-vollmond-token: $token" --data '{"mode":"onenight"}' $base/api/rooms/$code/settings
          for _ in 1 2; do curl -sf -X POST -H 'content-type: application/json' -H "x-vollmond-token: $token" --data '{}' $base/api/rooms/$code/bot; done
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -H "x-vollmond-token: $token" --data '{}' $base/api/rooms/$code/start)" = 204
          curl -s -N --max-time 2 "$base/api/rooms/$code/events?p=$me" | grep -q '"mode":"onenight"'
          if curl -s -N --max-time 2 "$base/api/rooms/$code/events" | grep -q '"role":"[a-z]'; then echo "the big screen saw a One night card"; exit 1; fi
          # The Census forwarder is wired in; without VOLLMOND_CENSUS it answers locally.
          test "$(curl -s -o /dev/null -w '%{http_code}' $base/_e.js)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST --data '{}' $base/_e)" = 204
          # Without Dashboard: its values block in the page with the built-in ones, and the manifest.
          curl -sf $base/ | grep -q '<script type="application/json" id="ewo-config">{"lang":"system","theme":"system","sounds":true}</script>'
          curl -sf $base/KXPT/screen | grep -q 'id="ewo-config"'
          curl -sf $base/ewo.config.json | grep -q '"app": "vollmond"'

      # The server against a stand-in for Dashboard's apps' port: it takes the manifest, the family's
      # dark theme and English reach the page, and so do sounds off set for Vollmond.
      - name: Smoke test Dashboard's values
        run: |
          node --input-type=module -e "
            import http from 'node:http';
            http.createServer((req, res) => {
              if (req.method === 'PUT' && req.url === '/v1/manifest/vollmond') { req.resume(); return res.writeHead(204).end(); }
              if (req.url === '/v1/config/vollmond') return res.writeHead(200, { 'content-type': 'application/json', etag: '\"1\"' }).end(JSON.stringify({ family: { theme: 'dark', lang: 'en' }, app: { sounds: false } }));
              res.writeHead(404).end();
            }).listen(6098);
          " &
          DASHBOARD_URL=http://127.0.0.1:6098 PORT=6097 node server/server.mjs &
          for _ in $(seq 1 20); do curl -sf http://127.0.0.1:6097/healthz && break; sleep 0.5; done
          for _ in $(seq 1 20); do curl -sf http://127.0.0.1:6097/ | grep -q '"theme":"dark"' && break; sleep 0.5; done
          curl -sf http://127.0.0.1:6097/ | grep -q '{"lang":"en","theme":"dark","sounds":false}'
